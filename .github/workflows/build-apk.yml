name: Build Android APK (Free GitHub Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sportage OBD APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy 'tools'
          # package, which Google removed from the SDK repository - it now
          # fails the whole workflow. Install only what still exists.
          packages: platform-tools

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-launcher-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
