name: Android APK

# Builds the native Sportage OBD launcher (android/) on every push and pull request,
# signs the release APK when keystore secrets are configured, and attaches the APKs to a
# GitHub Release when a v* tag is pushed.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-events: 1000
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # ---------------------------------------------------------------- signing
      # Add these repository secrets to produce a signed release APK:
      #   RELEASE_KEYSTORE_BASE64    base64 of your .jks file (single line)
      #   RELEASE_KEYSTORE_PASSWORD  keystore password
      #   RELEASE_KEY_ALIAS          key alias inside the keystore
      #   RELEASE_KEY_PASSWORD       password for that alias
      # Without them the workflow still succeeds, but the release APK is unsigned.
      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::notice::RELEASE_KEYSTORE_BASE64 is not set - release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "Keystore restored ($(wc -c < release.jks) bytes)."

      # ------------------------------------------------------------------ build
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          SPORTAGE_KEYSTORE_FILE: release.jks
          SPORTAGE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SPORTAGE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPORTAGE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "== $apk"
            if "$apksigner" verify --print-certs "$apk"; then
              echo "   signed OK"
            else
              echo "::warning file=$apk::APK is unsigned (no signing secrets configured)."
            fi
          done

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          # Deterministic artifact set: one debug APK + one release APK.
          for f in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/out/"
            fi
          done
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/out" 2>/dev/null)" ]; then
            echo "::error::No APKs found under app/build/outputs/apk" >&2
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: sportage-obd-apk
          path: out

      # AGP names an unsigned release "app-release-unsigned.apk", so a tag build without
      # signing secrets fails here instead of publishing an uninstallable artifact.
      - name: Require a signed release APK
        run: |
          if ls out/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::Release APK is unsigned. Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD repository secrets."
            exit 1
          fi
          ls -lh out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
