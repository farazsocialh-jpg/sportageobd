name: Android CI

# Lints, tests, and builds the native Sportage OBD launcher (android/) on every push and pull
# request. A signed release APK *and* the Play-ready AAB are produced when keystore secrets are
# configured; the R8 mapping file is uploaded for every release build so crashes from a shipped
# build can always be de-obfuscated. Pushing a v* tag attaches the artifacts to a GitHub Release.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-events: 1000
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # ---------------------------------------------------------------- signing
      # Repository secrets for a signed release (an AAB uploaded to Play must be signed):
      #   RELEASE_KEYSTORE_BASE64    base64 of your .jks file (single line)
      #   RELEASE_KEYSTORE_PASSWORD  keystore password
      #   RELEASE_KEY_ALIAS          key alias inside the keystore
      #   RELEASE_KEY_PASSWORD       password for that alias
      # Without them the workflow still succeeds, but release artifacts are unsigned.
      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::notice::RELEASE_KEYSTORE_BASE64 is not set - release artifacts will be unsigned."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "Keystore restored ($(wc -c < release.jks) bytes)."

      # Optional Firebase configuration. Without it the app compiles and Crashlytics/Analytics
      # stay dormant (see docs/ANALYTICS.md); with it, Crashlytics also receives the mapping file.
      - name: Prepare Firebase config
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set - diagnostics stay disabled."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "google-services.json restored."

      # ------------------------------------------------------------------ checks
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ------------------------------------------------------------------ build
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK and AAB
        env:
          SPORTAGE_KEYSTORE_FILE: release.jks
          SPORTAGE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SPORTAGE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPORTAGE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Monotonic Play versionCode: the workflow run number, never a hand-edited constant.
          SPORTAGE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Crashlytics mapping file
        if: steps.firebase.outputs.present == 'true'
        run: ./gradlew uploadCrashlyticsMappingFileRelease --stacktrace

      - name: Verify artifact signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "== $apk"
            if "$apksigner" verify --print-certs "$apk"; then
              echo "   signed OK"
            else
              echo "::warning file=$apk::APK is unsigned (no signing secrets configured)."
            fi
          done
          for aab in $(find app/build/outputs/bundle -name "*.aab"); do
            echo "== $aab"
            jarsigner -verify "$aab" || echo "::warning file=$aab::AAB is unsigned."
          done

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab; do
            if [ -f "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/out/"
            fi
          done
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/out" 2>/dev/null)" ]; then
            echo "::error::No artifacts found under app/build/outputs" >&2
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Collect reports
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          cp -r app/build/reports/lint-results-debug.* "$GITHUB_WORKSPACE/reports/" 2>/dev/null || true
          cp -r app/build/reports/tests/testDebugUnitTest "$GITHUB_WORKSPACE/reports/unit-tests" 2>/dev/null || true
          ls -R "$GITHUB_WORKSPACE/reports" | head -40

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-release
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # Required to symbolicate a crash from a shipped (R8-minified) build.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sportage-obd-release
          path: out

      # AGP names an unsigned release "app-release-unsigned.apk", so a tag build without signing
      # secrets fails here instead of publishing an uninstallable artifact.
      - name: Require a signed release
        run: |
          if ls out/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::Release is unsigned. Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD repository secrets."
            exit 1
          fi
          ls -lh out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.aab
          generate_release_notes: true
          fail_on_unmatched_files: false
