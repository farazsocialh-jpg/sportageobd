name: Sportage Companion APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Companion APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-${HOME}/android-sdk}"
          CMDLINE="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMDLINE" ]; then
            mkdir -p "${ANDROID_HOME}/cmdline-tools"
            cd "${ANDROID_HOME}/cmdline-tools"
            curl -fsSL \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o cmdline-tools.zip
            unzip -q -o cmdline-tools.zip
            mv cmdline-tools latest
            rm -f cmdline-tools.zip
            chmod +x "${CMDLINE}"
          fi
          yes | "$CMDLINE" --licenses >/dev/null 2>&1 || true
          "$CMDLINE" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::notice::RELEASE_KEYSTORE_BASE64 is not set - release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "Keystore restored ($(wc -c < release.jks) bytes)."


      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          SPORTAGE_KEYSTORE_FILE: release.jks
          SPORTAGE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SPORTAGE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPORTAGE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/out/"
            fi
          done
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/out" 2>/dev/null)" ]; then
            echo "::error::No APKs found under app/build/outputs/apk" >&2
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sportage-companion-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish companion release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: sportage-companion-apk
          path: out

      - name: Require a signed release APK
        run: |
          if ls out/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::Release APK is unsigned. Add signing secrets."
            exit 1
          fi
          ls -lh out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true