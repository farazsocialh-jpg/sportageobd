name: SportageOBD Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate_and_build:
    name: Lint, Test & Build Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Android Lint
        working-directory: ./android
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests (PidParser & ELM327 Tests)
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Assemble Debug and Release APKs
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Build Artifacts (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
