name: SportageOBD Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate_and_build:
    name: Lint, Test & Build Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Android Lint
        working-directory: ./android
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests (PidParser & ELM327 Tests)
        working-directory: ./android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Restore Release Signing Keystore
        # Signs the release APK when the ANDROID_KEYSTORE_BASE64 /
        # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
        # repository secrets are configured. Without them the release APK is
        # built unsigned (installable only via `adb install` with manual signing).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: ./android
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured - the release APK will be unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-signing.jks
          cat > keystore.properties <<EOF
          storeFile=release-signing.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble Debug and Release APKs
        working-directory: ./android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Build Artifacts (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: sportage-obd-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
