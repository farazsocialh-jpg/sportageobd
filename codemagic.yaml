# Codemagic CI/CD Workflows for Sportage OBD and Sportage Companion

workflows:
  car-workflow:
    name: Sportage OBD Android Launcher (Car Head Unit)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.sportage.obd"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set Android SDK local.properties
        script: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK" > "$CM_BUILD_DIR/android/local.properties"
      - name: Prepare Gradle wrapper
        script: |
          cd "$CM_BUILD_DIR/android"
          chmod +x gradlew
      - name: Build Car Debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleDebug --stacktrace
      - name: Build Car Release AAB
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - farazsocialh@gmail.com
        notify:
          success: true
          failure: true

  companion-workflow:
    name: Sportage Companion (Phone App)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.sportage.companion"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set Android SDK local.properties
        script: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK" > "$CM_BUILD_DIR/phone-companion/local.properties"
      - name: Prepare Gradle wrapper
        script: |
          cd "$CM_BUILD_DIR/phone-companion"
          chmod +x gradlew
      - name: Build Companion Debug APK
        script: |
          cd "$CM_BUILD_DIR/phone-companion"
          ./gradlew assembleDebug --stacktrace
      - name: Build Companion Release AAB
        script: |
          cd "$CM_BUILD_DIR/phone-companion"
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - phone-companion/app/build/outputs/**/*.apk
      - phone-companion/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - farazsocialh@gmail.com
        notify:
          success: true
          failure: true