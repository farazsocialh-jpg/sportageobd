# Codemagic CI/CD Workflow for Sportage OBD Intelligence Native Android Launcher
# Builds debug and installable APK for Android Head Units and Mobile Devices

workflows:
  android-workflow:
    name: Sportage OBD Android Launcher
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.sportage.obd"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set Android SDK local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Prepare Gradle wrapper
        script: |
          cd "$CM_BUILD_DIR/android"
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
      - name: Build Android APK
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - farazsocialh@gmail.com
        notify:
          success: true
          failure: true
