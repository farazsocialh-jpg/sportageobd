# Codemagic CI/CD Workflow for Sportage OBD Intelligence Native Android Launcher
# Builds debug and installable APK for Android Head Units and Mobile Devices

workflows:
  android-workflow:
    name: Sportage OBD Android Launcher
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.sportage.obd"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set Android SDK local.properties
        script: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK" > "$CM_BUILD_DIR/android/local.properties"
      - name: Prepare Gradle wrapper
        script: |
          cd "$CM_BUILD_DIR/android"
          if [ ! -f "gradle.properties" ] || ! grep -q "android.useAndroidX" "gradle.properties"; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
      # Lint and unit tests gate the build; a regression should never reach an artifact.
      - name: Lint and unit tests
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew lintDebug testDebugUnitTest --stacktrace
      - name: Build Android APK and Play AAB
        script: |
          cd "$CM_BUILD_DIR/android"
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      # Needed to de-obfuscate crash reports from R8-minified release builds.
      - android/app/build/outputs/mapping/release/mapping.txt
      - android/app/build/reports/**/*
    publishing:
      email:
        recipients:
          - farazsocialh@gmail.com
        notify:
          success: true
          failure: true
